name: Springboot Java CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Build & Test
        run: mvn clean -B package


      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar

   docker:
     runs-on: ubuntu:latest
     needs: build

     steps:
       - name: Checkout Code
         uses: actions/checkout@v4


      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target


      - name: Authentication to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{secrets.GCP_SA_KEY}}


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin


      - name: Configure GKE Auth Plugin
        run: echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV


      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev


      - name: Build Docker Image
        run: |
          docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} .


      - name: Push Docker Image
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}
         

   deploy:
     runs-on: ubuntu:latest
     needs: docker

     step:
       - name: Checkout Code
         uses: actions/checkout@v4


